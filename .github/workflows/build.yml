name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Fetch OCR models
        run: |
          pip install --break-system-packages rapidocr-onnxruntime==1.4.4
          M=$(python -c "import rapidocr_onnxruntime,os;print(os.path.join(os.path.dirname(rapidocr_onnxruntime.__file__),'models'))")
          mkdir -p app/src/main/assets/ocr
          cp "$M/ch_PP-OCRv4_det_infer.onnx" app/src/main/assets/ocr/det.onnx
          cp "$M/ch_PP-OCRv4_rec_infer.onnx" app/src/main/assets/ocr/rec.onnx
          python -c "import onnxruntime as o;s=o.InferenceSession('app/src/main/assets/ocr/rec.onnx');open('app/src/main/assets/ocr/keys.txt','w').write(s.get_modelmeta().custom_metadata_map['character'])"
          ls -la app/src/main/assets/ocr
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Build release APK (speed test)
        continue-on-error: true
        run: gradle --no-daemon assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n app.vocr/.MainActivity
            sleep 8
            mkdir -p shots
            adb exec-out screencap -p > shots/home.png
            adb shell am force-stop app.vocr
            adb shell am start -n app.vocr/.MainActivity --ez demo true
            sleep 150
            adb exec-out screencap -p > shots/strips.png
            adb shell am force-stop app.vocr
            adb shell am start -n app.vocr/.MainActivity --ez demo true --ez read true
            sleep 420
            adb exec-out screencap -p > shots/text.png
      - name: Name artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk vocr-debug-${{ github.run_number }}.apk
          cp app/build/outputs/apk/release/app-release.apk vocr-release-${{ github.run_number }}.apk || true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: V-OCR build ${{ github.run_number }}
          files: |
            vocr-debug-${{ github.run_number }}.apk
            vocr-release-${{ github.run_number }}.apk
            shots/home.png
            shots/strips.png
            shots/text.png
