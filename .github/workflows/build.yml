name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.13" }
      - name: Persist the signing key between runs (same signer = updates install over the top)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vocr-debug-keystore-v1
      - name: Fetch OCR models
        run: |
          pip install --break-system-packages rapidocr-onnxruntime==1.4.4
          M=$(python -c "import rapidocr_onnxruntime,os;print(os.path.join(os.path.dirname(rapidocr_onnxruntime.__file__),'models'))")
          mkdir -p app/src/main/assets/ocr
          cp "$M/ch_PP-OCRv4_det_infer.onnx" app/src/main/assets/ocr/det.onnx
          cp "$M/ch_PP-OCRv4_rec_infer.onnx" app/src/main/assets/ocr/rec.onnx
          python -c "import onnxruntime as o;s=o.InferenceSession('app/src/main/assets/ocr/rec.onnx');open('app/src/main/assets/ocr/keys.txt','w').write(s.get_modelmeta().custom_metadata_map['character'])"
          ls -la app/src/main/assets/ocr
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Build release APK (speed test)
        continue-on-error: true
        run: gradle --no-daemon assembleRelease
      - name: Build release bundle (AAB for Play)
        continue-on-error: true
        run: gradle --no-daemon bundleRelease
      - name: Check 16 KB alignment of native libs
        run: |
          mkdir -p /tmp/x && cd /tmp/x && unzip -oq $GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk 'lib/*'
          for f in lib/*/*.so; do echo "$f $(readelf -lW $f | awk '/LOAD/{print $NF}' | sort -u | tr '\n' ' ')"; done | tee $GITHUB_WORKSPACE/shots-align.txt || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n app.vocr/.MainActivity
            sleep 8
            mkdir -p shots
            adb exec-out screencap -p > shots/home.png
            adb logcat -d -b crash > shots/crash.txt || true
            adb logcat -d | grep -E 'AndroidRuntime|FATAL|vocr' | tail -80 > shots/logcat.txt || true
            adb shell am force-stop app.vocr
            adb shell am start -n app.vocr/.MainActivity --ez glassdemo true
            sleep 6
            adb exec-out screencap -p > shots/glass.png
            adb shell am force-stop app.vocr
            adb shell am start -n app.vocr/.MainActivity --ez queue true
            sleep 25
            adb exec-out screencap -p > shots/queue.png
            adb logcat -d | grep -E 'AndroidRuntime|FATAL' | tail -30 > shots/queuelog.txt || true
            adb shell am force-stop app.vocr
            adb shell am start -n app.vocr/.MainActivity --ez demo true
            sleep 150
            adb exec-out screencap -p > shots/strips.png
            adb shell am force-stop app.vocr
            adb shell am start -n app.vocr/.MainActivity --ez demo true --ez read true
            sleep 420
            adb exec-out screencap -p > shots/text.png
      - name: Name artifacts
        run: |
          for f in shots/crash.txt shots/logcat.txt shots/queuelog.txt; do echo "-- capture $f" >> $f; done
          cp app/build/outputs/apk/debug/app-debug.apk vocr-debug-${{ github.run_number }}.apk
          cp app/build/outputs/bundle/release/app-release.aab vocr-release-${{ github.run_number }}.aab || true
          cp shots-align.txt align-${{ github.run_number }}.txt || true
          cp app/build/outputs/apk/release/app-release.apk vocr-release-${{ github.run_number }}.apk || true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: V-OCR build ${{ github.run_number }}
          files: |
            vocr-debug-${{ github.run_number }}.apk
            vocr-release-${{ github.run_number }}.aab
            align-${{ github.run_number }}.txt
            vocr-release-${{ github.run_number }}.apk
            shots/home.png
            shots/glass.png
            shots/strips.png
            shots/text.png
            shots/crash.txt
            shots/logcat.txt
            shots/queue.png
            shots/queuelog.txt
